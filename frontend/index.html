<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de artículos científicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>Buscador de artículos científicos</h1>
        <p class="tagline">
          Explora arXiv, Semantic Scholar, OpenAlex, CrossRef, Scopus y más.
        </p>
        <button
          type="button"
          id="saved-refs-btn"
          class="nav-btn"
          title="Ver biblioteca Zotero"
        >
          📚 Mis Referencias
        </button>
      </header>

      <div id="library-view" class="hidden">
        <div class="view-header">
          <h2 id="library-title">📚 Referencias Guardadas (Zotero)</h2>
          <button type="button" id="back-to-search-btn" class="secondary-btn">
            ← Volver a buscar
          </button>
        </div>
        <div id="library-results" class="results"></div>
      </div>

      <main id="search-view">
        <form id="search-form" class="search-form">
          <div class="input-row">
            <input
              type="search"
              id="query"
              placeholder="Ej. software engineering, deep learning..."
              required
            />
            <button type="submit" id="submit-btn">Buscar</button>
          </div>
          <div class="context-row">
            <textarea
              id="ai-context"
              name="context"
              placeholder="Contexto para IA (opcional): ej. 'busco aplicaciones médicas', 'solo papers recientes', 'enfocado en deep learning'..."
              rows="2"
            ></textarea>
          </div>
          <div class="filters">
            <label class="filter-group">
              <span>Fuentes</span>
              <div class="checkboxes">
                <label
                  ><input type="checkbox" name="source" value="arxiv" checked />
                  arXiv</label
                >
                <label
                  ><input
                    type="checkbox"
                    name="source"
                    value="semantic_scholar"
                    checked
                  />
                  Semantic Scholar</label
                >
                <label
                  ><input
                    type="checkbox"
                    name="source"
                    value="openalex"
                    checked
                  />
                  OpenAlex</label
                >
                <label
                  ><input
                    type="checkbox"
                    name="source"
                    value="crossref"
                    checked
                  />
                  CrossRef</label
                >
                <label
                  ><input
                    type="checkbox"
                    name="source"
                    value="scopus"
                    checked
                  />
                  Scopus</label
                >
                <label
                  ><input
                    type="checkbox"
                    name="source"
                    value="springer"
                    checked
                  />
                  Springer Link</label
                >
              </div>
            </label>
            <label class="filter-group">
              <span>Ordenar por</span>
              <select name="sort" id="sort">
                <option value="relevance">Relevancia</option>
                <option value="pub_date">Fecha de publicación</option>
              </select>
            </label>
            <label class="filter-group">
              <span>Desde (fecha)</span>
              <input type="date" name="from_date" id="from_date" />
            </label>
            <label class="filter-group">
              <span>Hasta (fecha)</span>
              <input type="date" name="to_date" id="to_date" />
            </label>
            <label class="filter-group">
              <span>Máx. resultados</span>
              <input
                type="number"
                name="max_results"
                id="max_results"
                value="20"
                min="5"
                max="100"
              />
            </label>
            <label class="filter-group filter-llm">
              <input
                type="checkbox"
                name="use_llm_filter"
                id="use_llm_filter"
              />
              <span>🤖 Filtrar con IA</span>
            </label>
          </div>
        </form>
        <div id="results-controls" class="results-controls hidden">
          <button id="save-all-btn" class="secondary-btn">
            💾 Guardar todos los resultados en Zotero
          </button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
        <section id="results" class="results"></section>
      </main>
      <footer class="footer">
        <p>
          Para temas de investigación. Backend en Python (FastAPI), frontend en
          TypeScript.
        </p>
      </footer>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
